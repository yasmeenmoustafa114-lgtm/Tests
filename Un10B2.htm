        }

            margin-bottom: 20px;

        }

            background-color: var(--highlight);
            padding: 0 4px;
            border-radius: 4px;
        }

            background: #FFF;
            border: 1px solid #DDD;
            border-radius: 8px;
            margin-bottom: 30px;
        }
        details.vocab-details summary {
            padding: 15px;
            font-weight: bold;
            cursor: pointer;
            background: #E8F0FE;
            border-radius: 8px;
            outline: none;

        table {
            width: 100%;

        }

            padding: 12px;
            text-align: right;
            font-size: 16px;
        }
        th { background-color: var(--primary); color: white; }

        .section { display: none; animation: fadeIn 0.5s; }
        .section.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .question-block {
            margin-bottom: 25px;
            padding: 15px;
            border: 1px solid #EEE;
            border-radius: 8px;
        }
        .q-text { font-weight: bold; font-size: 20px; margin-bottom: 10px; }

        .option-btn {
            display: block;
            width: 100%;
            text-align: right;
            padding: 12px;
            margin: 8px 0;
            background: #F8F9FA;
            border: 2px solid #E0E0E0;
            border-radius: 8px;
            cursor: pointer;
            font-size: 18px;
            font-family: inherit;
            transition: 0.3s;
        }
        .option-btn:hover { background: #E8F0FE; }
        
        .correct { background: var(--success) !important; color: white; border-color: var(--success); pointer-events: none; }
        .wrong { background: var(--danger) !important; color: white; border-color: var(--danger); pointer-events: none; }

        select {
            padding: 10px;
            font-size: 18px;
            font-family: inherit;
            border-radius: 5px;
            border: 1px solid #CCC;
            outline: none;
            transition: 0.3s;
        }

        .word-bank { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
        .word-piece {
            padding: 8px 15px;
            background: var(--primary);
            color: white;
            border-radius: 20px;
            cursor: pointer;
            user-select: none;
        }
        .answer-zone {
            min-height: 50px;
            border: 2px dashed #BDC3C7;
            border-radius: 10px;
            padding: 10px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 10px;
            background: #FAFAFA;
        }

        .action-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 18px;
            border-radius: 8px;
            cursor: pointer;
            font-family: inherit;
            margin-top: 20px;
            display: block;
            width: 100%;
        }
        .action-btn:hover { background: #357ABD; }

        textarea {
            width: 100%;
            height: 60px;
            padding: 10px;
            font-size: 16px;
            font-family: inherit;
            border-radius: 8px;
            border: 1px solid #CCC;
            resize: vertical;
        }

        .flash-red { animation: flashRed 1s; }
        @keyframes flashRed { 0% { background-color: var(--danger); color: white;} 100% { background-color: white; color: inherit;} }

</head>

    ];

    // --- HELPER: Shuffle Array ---
    function shuffle(array) {
        let currentIndex = array.length, randomIndex;
        while (currentIndex !== 0) {
            randomIndex = Math.floor(Math.random() * currentIndex);
            currentIndex--;
            [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
        }
        return array;
    }

    // RENDERING FUNCTIONS
    // ==========================================

    function renderMCQ(dataArray, containerId, startNum) {
        const container = document.getElementById(containerId);
        let qNum = startNum;
        
        dataArray.forEach((item) => {
            const [qText, qOptions, qCorrect] = item;
            
            const qDiv = document.createElement('div');
            qDiv.className = 'question-block';
            
            const qTitle = document.createElement('div');
            qTitle.className = 'q-text';
            qTitle.textContent = `${qNum}. ${qText}`;
            qDiv.appendChild(qTitle);

            const optionsContainer = document.createElement('div');
            
            qOptions.forEach((opt) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.textContent = opt;
                btn.onclick = () => checkMCQ(btn, opt, qCorrect, optionsContainer);
                optionsContainer.appendChild(btn);
            });

            qDiv.appendChild(optionsContainer);
            container.appendChild(qDiv);
            qNum++;
        });
    }

    function checkMCQ(btn, selectedOption, correctOption, optionsContainer) {
        const buttons = optionsContainer.querySelectorAll('.option-btn');
        buttons.forEach(b => b.style.pointerEvents = 'none'); 

        if (selectedOption === correctOption) {
            btn.classList.add('correct');
            score++;
        } else {
            btn.classList.add('wrong');
            buttons.forEach(b => {
                if (b.textContent === correctOption) {
                    b.classList.add('correct');
                }
            });
        }
    }

    function renderFill(dataArray, wordsPool, containerId, startNum) {
        const container = document.getElementById(containerId);
        let qNum = startNum;
        const sortedWords = [...wordsPool].sort();

        dataArray.forEach((item) => {
            const [beforeTxt, afterTxt, correctWord] = item;
            
            const qDiv = document.createElement('div');
            qDiv.className = 'question-block';
            qDiv.style.display = 'flex';
            qDiv.style.alignItems = 'center';
            qDiv.style.gap = '10px';
            qDiv.style.flexWrap = 'wrap';
            
            const numSpan = document.createElement('span');
            numSpan.style.fontWeight = 'bold';
            numSpan.textContent = `${qNum}.`;

            const txt1 = document.createElement('span');
            txt1.textContent = beforeTxt;

            const select = document.createElement('select');
            select.innerHTML = `<option value="">--- اختاري ---</option>`;
            sortedWords.forEach(w => {
                select.innerHTML += `<option value="${w}">${w}</option>`;
            });

            const txt2 = document.createElement('span');
            txt2.textContent = afterTxt;

            select.onchange = () => {
                if (select.value === correctWord) {
                    select.style.backgroundColor = 'var(--success)';
                    select.style.color = 'white';
                    select.disabled = true;
                    score++;
                } else {
                    select.classList.add('flash-red');
                    setTimeout(() => {
                        select.classList.remove('flash-red');
                        select.value = '';
                    }, 1000);
                }
            };

            qDiv.appendChild(numSpan);
            qDiv.appendChild(txt1);
            qDiv.appendChild(select);
            qDiv.appendChild(txt2);
            container.appendChild(qDiv);
            qNum++;
        });
    }

    function renderOrdering(sentencesArray, containerId, startNum) {
        const container = document.getElementById(containerId);
        let qNum = startNum;

        sentencesArray.forEach((sentence, i) => {
            const qDiv = document.createElement('div');
            qDiv.className = 'question-block';
            
            const qTitle = document.createElement('div');
            qTitle.className = 'q-text';
            qTitle.textContent = `${qNum}. رَتِّبِي الْكَلِمَاتِ:`;
            
            const answerZone = document.createElement('div');
            answerZone.className = 'answer-zone';
            answerZone.id = `ans-zone-${i}`;

            const wordBank = document.createElement('div');
            wordBank.className = 'word-bank';
            wordBank.id = `bank-zone-${i}`;

            const words = shuffle(sentence.split(' '));
            
            words.forEach((w, wIndex) => {
                const wordBtn = document.createElement('div');
                wordBtn.className = 'word-piece';
                wordBtn.textContent = w;
                wordBtn.id = `word-${i}-${wIndex}`; 
                
                wordBtn.onclick = () => {
                    if (wordBtn.parentElement.id === wordBank.id) {
                        answerZone.appendChild(wordBtn);
                    } else {
                        wordBank.appendChild(wordBtn);
                    }
                };
                wordBank.appendChild(wordBtn);
            });

            const checkBtn = document.createElement('button');
            checkBtn.className = 'action-btn';
            checkBtn.style.marginTop = '10px';
            checkBtn.style.width = 'auto';
            checkBtn.textContent = 'تَحَقَّقْ (Проверить)';
            
            checkBtn.onclick = () => {
                const currentAnswer = Array.from(answerZone.children).map(node => node.textContent).join(' ');
                if (currentAnswer === sentence) {
                    answerZone.style.backgroundColor = '#D5F5E3';
                    answerZone.style.borderColor = 'var(--success)';
                    checkBtn.style.display = 'none';
                    Array.from(answerZone.children).forEach(n => n.style.pointerEvents = 'none');
                    score++;
                } else {
                    answerZone.classList.add('flash-red');
                    setTimeout(() => {
                        answerZone.classList.remove('flash-red');
                        while(answerZone.firstChild) {
                            wordBank.appendChild(answerZone.firstChild);
                        }
                    }, 1000);
                }
            };

            qDiv.appendChild(qTitle);
            qDiv.appendChild(answerZone);
            qDiv.appendChild(wordBank);
            qDiv.appendChild(checkBtn);
            container.appendChild(qDiv);
            qNum++;
        });
    }

    function renderEssay(wordsArray, containerId, startNum) {
        const container = document.getElementById(containerId);
        let qNum = startNum;

        wordsArray.forEach(word => {
            const qDiv = document.createElement('div');
            qDiv.className = 'question-block';
            
            const qTitle = document.createElement('div');
            qTitle.className = 'q-text';
            qTitle.textContent = `${qNum}. اِسْتَخْدِمِي كَلِمَةَ (${word}):`;
            
            const textarea = document.createElement('textarea');
            textarea.placeholder = 'اكْتُبِي الْجُمْلَةَ هُنَا... (Напишите предложение здесь...)';

            qDiv.appendChild(qTitle);
            qDiv.appendChild(textarea);
            container.appendChild(qDiv);
            qNum++;
        });
    }

        window.scrollTo(0,0);
    }

    window.onload = init;
</script>
